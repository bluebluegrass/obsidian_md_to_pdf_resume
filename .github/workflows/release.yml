name: Publish release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check-release
      - name: Create installation ZIP
        run: |
          mkdir -p release/resume-pdf-exporter
          cp main.js manifest.json styles.css release/resume-pdf-exporter/
          cd release
          zip -r ../resume-pdf-exporter.zip resume-pdf-exporter
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" resume-pdf-exporter.zip main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
